<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Torcedor</title>
    <link rel="icon" href="image/bola.png">
    <!-- item acime serve para colocar ícone no title -->
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
<header>
  <h1>Cadastro do Torcedor</h1>
  <img src="image/bola.png" alt="bola">  
  <!-- logo da página - uma bola -->
</header>

    <main>
      <div class="container">
        <h2>Informações do Torcedor</h2>

        <form action="#" method="post">

        <!-- usei o fieldset por questão de estética, para ficar harmonioso. Legend é utilizado definir o que cada fieldset se refere -->
          <fieldset class="pessoais">
            <legend>Dados Pessoais</legend>
            <!-- Nome -->
            <label for="nameTorcedor"> Nome: </label>
            <input
              type="text"
              id="nameTorcedor"
              name="nameTorcedor"
              placeholder="Digite seu nome completo"
              required/>
            <!-- CPF -->
            <label for="cpfTorcedor">CPF:</label>
            <input
              type="text"
              id="cpfTorcedor"
              name="cpfTorcedor"
              placeholder="000.000.000-00"
              required
            />
          </fieldset>

          <!-- Fieldset para encapsular o radio que pergunta a frequencia de ida ao estádio -->
          <fieldset class="estadio">
            <legend>Com que frequência você vai ao estádio de futebol</legend>

            <div class="radio-group">
              <label
                ><input
                  type="radio"
                  name="frequencia"
                  value="Raramente"
                  required
                />
                Raramente</label
              >
              <label
                ><input type="radio" name="frequencia" value="Muito pouco" />
                Frequentemente</label
              >
              <label
                ><input type="radio" name="frequencia" value="Frequentemente" />
                Nunca </label
              >
            </div>
          </fieldset>

          <!-- fieldset para saber se tem camisa e se é sócio torcedor -->
          <fieldset class="socioecamisa">
            <legend>Sócio e Camisa</legend>

            <!-- Sócio e camisa - utilizado o checkbox pois o usuário pode escolher mais de uma opção -->
            <div class="checkbox-socio">
              <label
                ><input type="checkbox" id="socio" name="socio" value="Sim" />
                Sou sócio torcedor</label
              >
              <label
                ><input type="checkbox" id="camisa" name="camisa" value="Sim" />
                Possuo camisa oficial do time</label
              >
            </div>
          </fieldset>

          <!-- utilizado o select pois é a melhor forma do usuário esscolher apenas uma opção -->
          <label for="timeTorcedor" class="timecor"
            >Qual é o seu time do coração (Série A do Brasileirão):</label>
          <select id="timeTorcedor" name="timeTorcedor" required>
            <option value="">Selecione seu time</option>
            <option value="atletico-mg">Atlético-MG</option>
            <option value="bahia">Bahia</option>
            <option value="botafogo">Botafogo</option>
            <option value="ceara">Ceará</option>
            <option value="corinthians">Corinthians</option>
            <option value="flamengo">Flamengo</option>
            <option value="fluminense">Fluminense</option>
            <option value="fortaleza">Fortaleza</option>
            <option value="internacional">Internacional</option>
            <option value="juventude">Juventude</option>
            <option value="palmeiras">Palmeiras</option>
            <option value="bragantino">Red Bull Bragantino</option>
            <option value="santos">Santos</option>
            <option value="sao-paulo">São Paulo</option>
            <option value="sport">Sport</option>
            <option value="vasco">Vasco da Gama</option>
            <option value="vitoria">Vitória</option>
          </select>

          <!-- Utilizado uma div para encapsular os Botões, não foi utilizado classe para o botão enviar pois não vi 
           necessidade de formatá-lo como o botão o btn limpar -->
            <div class="buttons">
               <button type="submit">Enviar</button>
               <button type="reset" class="btnLimpar">Limpar</button>
            </div>
        </form>
      </div>
    </main>
    <!-- footer para colocar meu nome e o github no rodapé da página -->
    <footer><p>Criado por Juliana N. Santos</p>
        <!-- Github: <a href="https://github.com/jnscode-tech/FormularioTorcedor.git"></a> -->
        <a href="https://github.com/jnscode-tech/FormularioTorcedor.git">Aqui está o GitHub do projeto</a>
    </footer>
  </body>
</html>
